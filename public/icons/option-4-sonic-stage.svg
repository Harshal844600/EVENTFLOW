<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="opt4NeonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFE17C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="opt4ElectricTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="opt4StageGlow" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#FFE17C" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#171E19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="opt4Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212C24" />
      <stop offset="100%" stop-color="#0E1310" />
    </linearGradient>
  </defs>

  <!-- Circular Stadium Frame -->
  <circle cx="50" cy="50" r="44" fill="url(#opt4Dark)" stroke="url(#opt4NeonGold)" stroke-width="2" />
  <circle cx="50" cy="50" r="44" fill="url(#opt4StageGlow)" />

  <!-- Concert Amphitheater Stage Arcs -->
  <!-- Outer Ring Arc -->
  <path
    d="M 18 68 C 24 36 76 36 82 68"
    fill="none"
    stroke="url(#opt4ElectricTeal)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="6 4"
  />

  <!-- Middle Soundwave Arc -->
  <path
    d="M 26 72 C 32 46 68 46 74 72"
    fill="none"
    stroke="url(#opt4NeonGold)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Inner Stage Arc -->
  <path
    d="M 34 76 C 38 58 62 58 66 76"
    fill="none"
    stroke="url(#opt4ElectricTeal)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Converging AI Spotlight Beams -->
  <polygon points="50,22 42,78 58,78" fill="url(#opt4NeonGold)" opacity="0.25" />

  <!-- Stage Center AI Supernova Beacon -->
  <path
    d="M 50 16 C 50 26 44 32 34 32 C 44 32 50 38 50 48 C 50 38 56 32 66 32 C 56 32 50 26 50 16 Z"
    fill="url(#opt4NeonGold)"
  />
  <circle cx="50" cy="32" r="3" fill="#FFFFFF" />

  <!-- Crowd / Sonic Particles -->
  <circle cx="28" cy="74" r="1.8" fill="#FFE17C" />
  <circle cx="38" cy="78" r="1.8" fill="#06B6D4" />
  <circle cx="50" cy="80" r="2.2" fill="#FFE17C" />
  <circle cx="62" cy="78" r="1.8" fill="#06B6D4" />
  <circle cx="72" cy="74" r="1.8" fill="#FFE17C" />
</svg>
