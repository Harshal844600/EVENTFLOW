<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Gradient -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="40%" stop-color="#FFE17C" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- AI Cyber Cyan Accent -->
    <linearGradient id="logoCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Dark Shield Substrate -->
    <linearGradient id="logoPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243028" />
      <stop offset="60%" stop-color="#171E19" />
      <stop offset="100%" stop-color="#0E1310" />
    </linearGradient>

    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE17C" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#171E19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#logoGlow)" />

  <!-- Geometric AI Event Ticket Emblem -->
  <!-- Outer Chamfered Ticket Silhouette -->
  <path
    d="M 22 18
       C 22 11 27 6 34 6
       L 66 6
       C 73 6 78 11 78 18
       L 78 39
       C 72 39 68 44 68 50
       C 68 56 72 61 78 61
       L 78 82
       C 78 89 73 94 66 94
       L 34 94
       C 27 94 22 89 22 82
       L 22 61
       C 28 61 32 56 32 50
       C 32 44 28 39 22 39
       Z"
    fill="url(#logoPlate)"
    stroke="url(#logoGold)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Perforated Inner Flow Track -->
  <path
    d="M 27 21
       C 27 16 31 12 36 12
       L 64 12
       C 69 12 73 16 73 21
       L 73 37
       C 67 39 63 44 63 50
       C 63 56 67 61 73 63
       L 73 79
       C 73 84 69 88 64 88
       L 36 88
       C 31 88 27 84 27 79
       L 27 63
       C 33 61 37 56 37 50
       C 37 44 33 39 27 37
       Z"
    fill="none"
    stroke="url(#logoCyan)"
    stroke-width="1.2"
    stroke-dasharray="3 2.5"
    opacity="0.6"
  />

  <!-- Orbital Energy Rings -->
  <g transform="rotate(-30 50 50)">
    <ellipse
      cx="50"
      cy="50"
      rx="30"
      ry="11"
      fill="none"
      stroke="url(#logoGold)"
      stroke-width="1.4"
      stroke-dasharray="6 3 2 3"
      opacity="0.75"
    />
    <circle cx="80" cy="50" r="2" fill="#FFE17C" />
  </g>

  <g transform="rotate(30 50 50)">
    <ellipse
      cx="50"
      cy="50"
      rx="30"
      ry="11"
      fill="none"
      stroke="url(#logoCyan)"
      stroke-width="1.4"
      stroke-dasharray="4 4"
      opacity="0.75"
    />
    <circle cx="50" cy="39" r="2" fill="#10B981" />
  </g>

  <!-- Central AI Neural Spark Core -->
  <path
    d="M 50 31
       C 50 41 41 50 31 50
       C 41 50 50 59 50 69
       C 50 59 59 50 69 50
       C 59 50 50 41 50 31
       Z"
    fill="url(#logoGold)"
  />

  <!-- Secondary Inner Diamond -->
  <path
    d="M 50 40
       C 50 46 46 50 40 50
       C 46 50 50 54 50 60
       C 50 54 54 50 60 50
       C 54 50 50 46 50 40
       Z"
    fill="#FFFFFF"
    opacity="0.95"
  />

  <circle cx="50" cy="50" r="2.2" fill="#171E19" />
  <circle cx="50" cy="50" r="1.2" fill="#FFE17C" />
</svg>
